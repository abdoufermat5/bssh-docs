name: Docs

on:
  pull_request:
  push:
    branches: [main]
  # Daily, so https://bssh.abdoufermat.dev/install.sh follows new bayesian-ssh releases.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for "last updated" dates
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build # fails on broken internal links (starlight-links-validator)
        env:
          DOCS_SITE: ${{ vars.DOCS_SITE }}
          # The latest release and star count are read from the GitHub API at build time.
          GITHUB_TOKEN: ${{ github.token }}
      # The installer of the latest bayesian-ssh release, served at /install.sh.
      # Releases attach it and list it in the cosign-signed SHA256SUMS: both are
      # checked before publishing. Releases older than that have no asset; the
      # script is then taken at the release tag.
      - uses: sigstore/cosign-installer@v3
      - name: Installer
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: abdoufermat5/bayesian-ssh
        run: |
          tag=$(gh release view -R "$REPO" --json tagName -q .tagName)
          tmp=$(mktemp -d)
          if gh release download "$tag" -R "$REPO" -D "$tmp" -p install.sh -p SHA256SUMS -p SHA256SUMS.sigstore.json 2>/dev/null \
             && [ -f "$tmp/install.sh" ]; then
            cosign verify-blob --bundle "$tmp/SHA256SUMS.sigstore.json" \
              --certificate-identity-regexp '^https://github\.com/abdoufermat5/bayesian-ssh/\.github/workflows/release\.yml@refs/(tags/v.+|heads/main)$' \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/SHA256SUMS"
            (cd "$tmp" && grep '  install.sh$' SHA256SUMS | sha256sum -c -)
            echo "install.sh from the $tag release assets, signature and checksum verified"
          else
            curl -fsSL "https://raw.githubusercontent.com/$REPO/$tag/install.sh" -o "$tmp/install.sh"
            echo "::notice::$tag has no install.sh asset; published the script at the $tag tag"
          fi
          bash -n "$tmp/install.sh"
          cp "$tmp/install.sh" dist/install.sh
      # The apt and dnf repository (/apt, /rpm, /bssh.asc, /bssh.gpg), built and signed
      # by a bayesian-ssh release as bssh-repo.tar.gz. Each deploy replaces the whole
      # site, so it comes from the newest release that has one: a release built without
      # the signing key must not take the repository down for everyone.
      - name: Package repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: abdoufermat5/bayesian-ssh
        run: |
          tmp=$(mktemp -d)
          found=""
          for tag in $(gh release list -R "$REPO" --exclude-drafts --exclude-pre-releases --limit 10 --json tagName -q '.[].tagName'); do
            if gh release download "$tag" -R "$REPO" -D "$tmp/$tag" -p bssh-repo.tar.gz -p SHA256SUMS -p SHA256SUMS.sigstore.json 2>/dev/null \
               && [ -f "$tmp/$tag/bssh-repo.tar.gz" ]; then
              found="$tag"
              break
            fi
          done
          if [ -z "$found" ]; then
            echo "::notice::no recent release has bssh-repo.tar.gz: no apt/dnf repository published"
            exit 0
          fi
          cosign verify-blob --bundle "$tmp/$found/SHA256SUMS.sigstore.json" \
            --certificate-identity-regexp '^https://github\.com/abdoufermat5/bayesian-ssh/\.github/workflows/release\.yml@refs/(tags/v.+|heads/main)$' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$tmp/$found/SHA256SUMS"
          (cd "$tmp/$found" && grep '  bssh-repo.tar.gz$' SHA256SUMS | sha256sum -c -)
          tar -xzf "$tmp/$found/bssh-repo.tar.gz" -C dist --no-same-owner
          test -f dist/apt/dists/stable/InRelease && test -f dist/rpm/repodata/repomd.xml.asc
          echo "apt/dnf repository from $found, signature and checksum verified"
      - name: Custom domain
        if: vars.DOCS_SITE != ''
        run: echo "${{ vars.DOCS_SITE }}" | sed -E 's#^https?://##; s#/.*$##' > dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
